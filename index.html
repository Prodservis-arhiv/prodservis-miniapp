<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Завантаження форми…</title>
</head>
<body style="margin:0;padding:40px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;color:#666;">
  <p>Завантаження форми…</p>
  <script>
    // ==========================================================================
    // ВАЖЛИВО: замініть значення нижче на /exec URL вашого проєкту MiniApp
    // (той самий, що ви деплоїли в Apps Script для форми "Ручне").
    // ==========================================================================
    var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwSJ5OTsSmZXFagPbxwrUDnWW1oqhWea0ZiVRGSznFCDpuyyvtp3pXz2vR9jZD52-kh/exec';

    // Telegram передає initData як хеш поточної сторінки:
    // "#tgWebAppData=...&tgWebAppVersion=...&tgWebAppPlatform=..."
    // Ми читаємо це ТУТ (на звичайній сторінці, без вкладеного iframe Apps
    // Script) і передаємо далі як звичайний параметр посилання — такі
    // параметри Apps Script коректно отримує на сервері.
    var hash = window.location.hash;
    var target = APPS_SCRIPT_URL;

    if (hash && hash.length > 1) {
      var params = new URLSearchParams(hash.substring(1));
      var initData = params.get('tgWebAppData');
      if (initData) {
        target += (APPS_SCRIPT_URL.indexOf('?') === -1 ? '?' : '&') +
          'tgWebAppData=' + encodeURIComponent(initData);
      }
    }

    window.location.replace(target);
  </script>
</body>
</html>
